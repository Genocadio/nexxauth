name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (tests + build + CVE scan)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # so the OWASP SARIF report can be uploaded
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            ~/.gradle/dependency-check-data
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Unit / integration tests (H2)
        run: ./gradlew test

      - name: Build
        run: ./gradlew build -x test

      - name: OWASP Dependency-Check (CVE scan)
        run: ./gradlew dependencyCheckAnalyze
        timeout-minutes: 30
        env:
          # Allow the scan to pass if the NVD feed is temporarily unavailable
          # (the download is large and occasionally rate-limited); the SARIF is
          # still uploaded for code scanning.
          DEPENDENCYCHECK_FAIL_ON_ERROR: "false"

      - name: Upload dependency-check report
        uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: dependency-check-report
          path: build/reports/dependency-check-report/
          retention-days: 14

      - name: Upload SARIF to code scanning
        if: ${{ always() }}
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: build/reports/dependency-check-report/dependency-check-report.sarif
          category: dependency-check

  web:
    name: Web (lint + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

  e2e:
    name: End-to-end (backend + web)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nexxauth
          POSTGRES_USER: nexxauth
          POSTGRES_PASSWORD: nexxauth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexxauth -d nexxauth"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: web
    env:
      # The Playwright webServer runs ./gradlew bootRun. Spring Boot's
      # docker-compose integration would start its own Postgres; disable it and
      # point the datasource + rate-limit store at the CI services instead.
      SPRING_DOCKER_COMPOSE_ENABLED: "false"
      SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/nexxauth
      SPRING_DATASOURCE_USERNAME: nexxauth
      SPRING_DATASOURCE_PASSWORD: nexxauth
      JAVA_TOOL_OPTIONS: >-
        -Dapp.rate-limit.store=redis
        -Dapp.rate-limit.redis.host=localhost
        -Dapp.rate-limit.redis.port=6379
        -Dapp.rate-limit.login.capacity=100
        -Dapp.rate-limit.login.refill-per-minute=60
        -Dapp.rate-limit.register.capacity=100
        -Dapp.rate-limit.register.refill-per-minute=60
        -Dapp.rate-limit.refresh.capacity=100
        -Dapp.rate-limit.refresh.refill-per-minute=60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.14"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-e2e-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties') }}
          restore-keys: |
            gradle-e2e-${{ runner.os }}-

      - name: Cache Bun dependencies
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('web/bun.lock') }}

      - name: Install web dependencies
        run: bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: bunx playwright install --with-deps chromium

      - name: Run end-to-end tests
        run: bun run test:e2e

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: playwright-report
          path: web/test-results/
          retention-days: 14
