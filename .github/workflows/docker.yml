name: Build and Push x86 Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

  workflow_dispatch:
    inputs:
      force_backend:
        description: "Force rebuild backend image"
        type: boolean
        default: false
      force_web:
        description: "Force rebuild web image"
        type: boolean
        default: false

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push') }}

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          # Start with force overrides
          backend="${{ inputs.force_backend }}"
          web="${{ inputs.force_web }}"

          # If not forced, detect from git diff
          if [ "$backend" != "true" ]; then
            if git diff --quiet HEAD^ HEAD -- . ':!web'; then
              backend="false"
            else
              backend="true"
            fi
          fi

          if [ "$web" != "true" ]; then
            if git diff --quiet HEAD^ HEAD -- web; then
              web="false"
            else
              web="true"
            fi
          fi

          echo "backend=$backend" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Backend changed: $backend"
          echo "Web changed: $web"

  build-and-push:
    name: Build and push changed images
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: genoyves/nexxauth-backend:latest
          cache-from: type=gha,scope=nexxauth-backend
          cache-to: type=gha,mode=max,scope=nexxauth-backend

      - name: Build and push web
        if: ${{ needs.changes.outputs.web == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: genoyves/nexxauth-web:latest
          build-args: BACKEND_URL=http://backend:8080
          cache-from: type=gha,scope=nexxauth-web
          cache-to: type=gha,mode=max,scope=nexxauth-web