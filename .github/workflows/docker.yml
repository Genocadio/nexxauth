name: Build and Push x86 Docker Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}

    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2

      - name: Detect changed areas
        id: filter
        shell: bash
        run: |
          if git diff --quiet HEAD^ HEAD -- web; then
            echo "web=false" >> "$GITHUB_OUTPUT"
          else
            echo "web=true" >> "$GITHUB_OUTPUT"
          fi

          if git diff --quiet HEAD^ HEAD -- . ':!web'; then
            echo "backend=false" >> "$GITHUB_OUTPUT"
          else
            echo "backend=true" >> "$GITHUB_OUTPUT"
          fi

  build-and-push:
    name: Build and push changed images
    needs: changes
    runs-on: ubuntu-latest

    steps:
      - name: Checkout CI-validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push backend
        if: ${{ needs.changes.outputs.backend == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: genoyves/nexxauth-backend:latest
          cache-from: type=gha,scope=nexxauth-backend
          cache-to: type=gha,mode=max,scope=nexxauth-backend

      - name: Build and push web
        if: ${{ needs.changes.outputs.web == 'true' }}
        uses: docker/build-push-action@v7
        with:
          context: ./web
          platforms: linux/amd64
          push: true
          tags: genoyves/nexxauth-web:latest
          build-args: BACKEND_URL=http://backend:8080
          cache-from: type=gha,scope=nexxauth-web
          cache-to: type=gha,mode=max,scope=nexxauth-web