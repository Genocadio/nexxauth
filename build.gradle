plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nexxserve'
version = '1.0.0'

java {
	toolchain {
		// 17+ works; 21 is used here to match the installed JDK
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'

	// Rate limiting (token bucket) for brute-force protection on auth endpoints
	implementation 'com.bucket4j:bucket4j_jdk17-core:8.19.0'
	implementation 'com.bucket4j:bucket4j_jdk17-lettuce:8.19.0'
	implementation 'io.lettuce:lettuce-core'
	implementation 'com.github.ben-manes.caffeine:caffeine'

	// Versioned schema migrations (starter pulls in flyway-core + Boot 4 auto-configuration)
	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql'

	// Object mapping (no hand-written boilerplate)
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	// Lets MapStruct see Lombok-generated accessors during annotation processing
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// JWT (access tokens)
	implementation platform('io.jsonwebtoken:jjwt-bom:0.12.7')
	implementation 'io.jsonwebtoken:jjwt-api'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	runtimeOnly 'org.postgresql:postgresql'

	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-restclient-test'
	testImplementation 'com.h2database:h2'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	// Redis-backed rate-limit integration tests (tagged @Tag("redis")) need a
	// live Redis; they run in CI (Redis service) but are skipped locally unless
	// explicitly enabled with -PincludeRedisTests.
	boolean includeRedis = providers.gradleProperty('includeRedisTests').isPresent()
	useJUnitPlatform {
		if (!includeRedis) {
			excludeTags 'redis'
		}
	}
}

// Boot 4 removed the bootBuildInfo task; generate the build-info.properties
// that the actuator info endpoint reads (management.info.build.enabled=true).
def buildInfoDir = layout.buildDirectory.dir('resources/main/META-INF')

tasks.register('buildInfo') {
	outputs.dir(buildInfoDir)
	doLast {
		def dir = buildInfoDir.get().asFile
		dir.mkdirs()
		new File(dir, 'build-info.properties').text = """build.artifact=${project.name}
build.group=${project.group}
build.name=${project.name}
build.time=${java.time.Instant.now()}
build.version=${project.version}
"""
	}
}

tasks.named('processResources') {
	// Replace @project.version@-style tokens in properties files. Plain token
	// replacement leaves Spring's ${...} placeholders (e.g. ${ENVIRONMENT:...})
	// untouched, unlike Groovy expand().
	['application.properties', 'application-prod.properties'].each { name ->
		filesMatching(name) {
			filter(org.apache.tools.ant.filters.ReplaceTokens,
					tokens: ['project.version': project.version.toString()])
		}
	}
	dependsOn tasks.named('buildInfo')
}

tasks.withType(JavaCompile).configureEach {
	// Generate MapStruct mappers as Spring beans and ignore unmapped targets (e.g. ids set by JPA)
	options.compilerArgs.addAll([
		'-Amapstruct.defaultComponentModel=spring',
		'-Amapstruct.unmappedTargetPolicy=IGNORE'
	])
}
