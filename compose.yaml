services:
  postgres:
    image: postgres:16-alpine
    container_name: nauth-postgres
    environment:
      POSTGRES_DB: nauth
      POSTGRES_USER: nauth
      POSTGRES_PASSWORD: nauth
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nauth -d nauth"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nauth-redis
    ports:
      - "6379:6379"
    # Only needed when app.rate-limit.store=redis; kept here so the shared
    # bucket store is one `docker compose up` away.

volumes:
  postgres-data:
