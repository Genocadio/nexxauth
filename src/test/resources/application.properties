spring.application.name=nexxauth

# In-memory H2 (PostgreSQL compatibility mode) so tests need no Docker/Postgres
spring.datasource.url=jdbc:h2:mem:nexxauth;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Flyway runs the same migrations against H2, then Hibernate validates the entities
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

app.jwt.secret=D+yhh+rCq+euXn/UxUHgZoyY7zepQgF3CvJBQAPiRYPJpaIBqQ4Evl2DdXwnGTGe
app.jwt.issuer=nexxauth
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# Mirror of the management.* block in src/main/resources/application.properties:
# the test classpath shadows the main properties file, so tests must carry their
# own copy. Keep the two in sync when changing actuator settings.
management.endpoints.web.exposure.include=health,info
# Mirrors main: details only for authorized clients, probes still see UP/DOWN.
management.endpoint.health.show-details=when-authorized
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true
info.app.name=nexxauth
info.app.description=Nexxserve auth backend (platforms, platform users, JWT auth)
info.app.version=test-version

# Rate limits for tests: high caps so the shared MockMvc context (all requests
# come from 127.0.0.1) never trips the limiter; the 429 behavior is covered by
# RateLimitIntegrationTest with its own tiny limits.
app.rate-limit.enabled=true
app.rate-limit.login.capacity=100
app.rate-limit.login.refill-per-minute=60
app.rate-limit.register.capacity=100
app.rate-limit.register.refill-per-minute=60
app.rate-limit.refresh.capacity=100
app.rate-limit.refresh.refill-per-minute=60
app.rate-limit.use-forwarded-for=false
