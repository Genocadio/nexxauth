spring.application.name=nexxauth
server.port=8080

# --- Actuator (health/info on a separate management port; restrict access via
# firewall / k8s network policy — bind to localhost with
# management.server.address=127.0.0.1 if probes come from the same host) ---
management.server.port=8081
management.endpoints.web.exposure.include=health,info
# Details (incl. datasource/probe internals) only for authorized clients; probes
# still get the overall UP/DOWN state without auth.
management.endpoint.health.show-details=when-authorized
# Liveness/readiness probes for orchestrators (k8s: /actuator/health/liveness|readiness)
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.readiness.include=readinessState,db
management.info.env.enabled=true

# Exposed by the /actuator/info endpoint
info.app.name=${spring.application.name}
info.app.description=Nexxserve auth backend (platforms, platform users, JWT auth)
info.app.version=@project.version@

# --- Logging (dev: human-readable console with requestId; prod: structured JSON, see application-prod.properties) ---
logging.pattern.console=%clr(%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX}){faint} %clr(%5p) %clr(${PID:- }){magenta} %clr(---){faint} %clr([%15.15t]){faint} %clr([%X{requestId:-}]){cyan} %clr(%-40.40logger{39}){cyan} %clr(:){faint} %m%n%wEx

# --- PostgreSQL (local dev, started via docker compose) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/nexxauth
spring.datasource.username=nexxauth
spring.datasource.password=nexxauth
# Schema is versioned by Flyway (src/main/resources/db/migration); validate keeps entities in sync
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- HTTP hardening ---
# Reject request bodies larger than this (413) before they are buffered — a
# DoS guard so an oversized JSON payload cannot be parsed into memory.
app.http.max-body-bytes=65536

# --- CORS ---
# Browser origins allowed to call the API directly: the console (frontend) and
# backend public origins always qualify; app.cors.extra-origins appends more
# origins (comma-separated) that are treated exactly like the frontend origin.
# Requests from an organisation client (X-Client-Id) are handled by the
# org-level per-client CORS in ClientCorsFilter instead. No origins = no global
# CORS (per-client CORS still applies).
app.cors.frontend-origin=${APP_CORS_FRONTEND_ORIGIN:}
app.cors.backend-origin=${APP_CORS_BACKEND_ORIGIN:}
app.cors.extra-origins=${APP_CORS_EXTRA_ORIGINS:}

# --- JWT ---
# 384-bit secret (base64). Override in production via JWT_SECRET.
app.jwt.secret=${JWT_SECRET:D+yhh+rCq+euXn/UxUHgZoyY7zepQgF3CvJBQAPiRYPJpaIBqQ4Evl2DdXwnGTGe}
app.jwt.issuer=nexxauth
app.jwt.access-token-ttl=15m
app.jwt.refresh-token-ttl=7d

# --- Rate limiting (per client IP, token bucket) against brute force ---
# login: 5 attempts immediately, then 1 restored per minute
# register: 3 immediately, then 1 per minute
# refresh: 10 rotations immediately, then 2 per minute (legit clients rotate
#   on every 15-min access-token expiry; still throttles replay probing)
app.rate-limit.enabled=true
app.rate-limit.login.capacity=5
app.rate-limit.login.refill-per-minute=1
app.rate-limit.register.capacity=3
app.rate-limit.register.refill-per-minute=1
app.rate-limit.refresh.capacity=10
app.rate-limit.refresh.refill-per-minute=2
# Set true only behind a trusted proxy that sets X-Forwarded-For
app.rate-limit.use-forwarded-for=false
# Bucket store: "in-memory" (default, single instance) or "redis" (shared store
# for horizontal scaling; app.rate-limit.redis.host/port/password apply)
app.rate-limit.store=in-memory
app.rate-limit.redis.host=${REDIS_HOST:localhost}
app.rate-limit.redis.port=${REDIS_PORT:6379}
app.rate-limit.redis.password=${REDIS_PASSWORD:}
app.rate-limit.redis.ssl=${REDIS_SSL:false}

# Nightly token cleanup: keep enabled on exactly one instance in a multi-instance
# deployment (deletes are idempotent, so duplicates are only wasteful).
app.maintenance.token-cleanup-enabled=true
