# --- Production logging: structured JSON (ECS) + rotating file ---
# Activate with: ./gradlew bootRun --args='--spring.profiles.active=prod'
# or SPRING_PROFILES_ACTIVE=prod

# Console emits one JSON document per line (ECS) — the format Docker/K8s log
# drivers and log aggregators (Elastic, Loki, Datadog, ...) expect. MDC entries
# (requestId from RequestIdFilter) are included in every log event.
logging.structured.format.console=ecs
logging.structured.ecs.service.name=nexxauth
logging.structured.ecs.service.version=@project.version@
logging.structured.ecs.service.environment=${ENVIRONMENT:production}

# Rotating JSON file for on-host access / audit. Directory must exist or be
# mounted (e.g. a volume at /var/log/nexxauth).
logging.file.name=/var/log/nexxauth/nexxauth.log
logging.structured.format.file=ecs
logging.logback.rollingpolicy.max-file-size=50MB
logging.logback.rollingpolicy.max-history=14
logging.logback.rollingpolicy.total-size-cap=1GB

# --- Production log levels (noisy frameworks toned down; our code at INFO) ---
logging.level.root=INFO
logging.level.com.nexxserve.nexxauth=INFO
logging.level.org.hibernate=WARN
logging.level.org.flywaydb=WARN
logging.level.org.springframework.security=WARN
